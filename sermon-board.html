<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Sermon Prep Board</title>
<style>
  :root{
    --bg:#f4efe4;
    --ink:#2c2a26;
    --muted:#6f6a60;
    --card:#fffdf8;
    --line:#e4ddcc;
    --gold:#b08948;
    --research:#3f7d57;
    --writing:#4a5da8;
    --rehearse:#9a4a4a;
    --shadow:0 2px 10px rgba(60,50,30,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
  }
  .page{max-width:100%;padding:22px 22px 60px}
  h1.sitehead{
    font-family:Georgia,"Times New Roman",serif;
    font-size:26px;margin:0 0 2px;letter-spacing:.2px;
  }
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin:0 0 18px;
  }
  .toolbar label{font-size:13px;color:var(--muted)}
  select,button{font:inherit}
  button{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;
  }
  button:hover{border-color:var(--gold)}
  select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px}

  .board{display:flex;gap:18px;align-items:flex-start;overflow-x:auto;padding-bottom:14px}
  .col{
    flex:1 1 0;min-width:360px;max-width:520px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .col.hidden{display:none}
  .col-head{padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdf8,#faf5ea)}
  .col-head .title{
    width:100%;border:none;background:transparent;color:var(--ink);
    font-family:Georgia,serif;font-size:19px;font-weight:600;padding:2px 0;
  }
  .col-head .title:focus{outline:none;border-bottom:1px dashed var(--gold)}
  .metarow{display:flex;gap:8px;margin-top:6px}
  .metarow input{
    flex:1 1 auto;border:1px solid var(--line);border-radius:7px;background:#fff;
    padding:5px 8px;font-size:12.5px;color:var(--ink);
  }
  .metarow input.date{flex:0 0 130px}
  .metarow input:focus{outline:none;border-color:var(--gold)}
  .progwrap{margin-top:11px}
  .progbar{height:9px;background:#ece6d7;border-radius:6px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#caa463);transition:width .25s}
  .progtext{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}
  .col-actions{display:flex;gap:8px;margin-top:10px}
  .col-actions button{font-size:12px;padding:4px 9px}

  .col-body{padding:6px 14px 16px}
  details.stage{border-bottom:1px solid var(--line);padding:4px 0}
  details.stage:last-child{border-bottom:none}
  details.stage>summary{
    list-style:none;cursor:pointer;padding:11px 6px;display:flex;align-items:center;gap:9px;
    font-family:Georgia,serif;font-size:16px;font-weight:600;border-radius:8px;
  }
  details.stage>summary::-webkit-details-marker{display:none}
  details.stage>summary .chev{transition:transform .2s;color:var(--muted);font-size:12px}
  details.stage[open]>summary .chev{transform:rotate(90deg)}
  .stage.research>summary{color:var(--research)}
  .stage.writing>summary{color:var(--writing)}
  .stage.rehearse>summary{color:var(--rehearse)}
  .stage.stuck>summary{color:var(--gold)}
  .stage-inner{padding:2px 4px 12px}

  .phase{font-weight:700;font-size:13.5px;margin:14px 0 3px;letter-spacing:.3px}
  .phase .desc{font-weight:400;color:var(--muted);font-size:12.5px;display:block;margin-top:1px}
  .secthead{font-weight:600;font-size:13px;margin:11px 0 4px;color:#48433a}
  .note{
    font-size:12.5px;color:var(--muted);font-style:italic;
    border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:6px 0 6px 2px;
  }
  blockquote.q{
    margin:9px 2px;padding:9px 12px;background:#faf4e6;border-left:3px solid var(--gold);
    border-radius:0 8px 8px 0;font-family:Georgia,serif;font-style:italic;font-size:13px;color:#4a443a;
  }
  blockquote.q .cite{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:5px}

  ul.tasks{list-style:none;margin:4px 0;padding:0}
  ul.tasks ul.tasks{margin:2px 0 6px 22px}
  li.task{margin:3px 0}
  label.cb{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:13.5px}
  label.cb .box{margin:1px 0 0;flex:0 0 auto;width:16px;height:16px;border:1.5px solid #c7bfa9;border-radius:4px;background:#fff;position:relative;cursor:pointer;transition:background .12s,border-color .12s}
  label.cb .box::after{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:1}
  li.task.done>label.cb .box{background:var(--gold);border-color:var(--gold)}
  li.task.done>label.cb .box::after{content:"✓";color:#fff;font-size:11px;font-weight:700}
  li.task.skip>label.cb .box{background:#f1ead9}
  li.task.skip>label.cb .box::after{content:"–";color:#a59e8e;font-size:13px;font-weight:700}
  label.cb .txt{flex:1 1 auto;cursor:pointer;-webkit-user-select:none;user-select:none}
  li.task.skip>label.cb .txt{text-decoration:line-through;color:#a59e8e}
  li.task.selected{background:#fdf6e0;border-radius:6px;box-shadow:0 0 0 1px #e9dcbf inset}
  body.readonly label.cb,body.readonly label.cb .box{cursor:default}
  body.readonly label.cb .txt{cursor:default}
  .subnote{font-size:12px;color:var(--muted);margin:1px 0 3px 23px;font-style:italic}
  a{color:var(--writing);text-decoration:none;border-bottom:1px solid #c9d0ea}
  a:hover{border-bottom-color:var(--writing)}

  .hint{font-size:12px;color:var(--muted);margin-top:24px;max-width:760px}
  .hint code{background:#ece6d7;padding:1px 5px;border-radius:4px}
  @media (max-width:640px){
    .page{padding:14px 12px 44px}
    h1.sitehead{font-size:22px}
    .board{gap:12px}
    .col{flex:0 0 86vw;min-width:0;max-width:none}
    .metarow input.date{flex:0 0 112px}
    #editbar{top:6px;right:8px}
  }
  @media print{
    .toolbar,.col-actions{display:none}
    body{background:#fff}
    .board{display:block}
    .col{box-shadow:none;page-break-inside:avoid;margin-bottom:18px;max-width:none}
    details.stage{}
  }
</style>
</head>
<body>
<div class="page">
  <h1 class="sitehead">Sermon Prep Board</h1>

  <div class="toolbar">
    <label>Columns in view:</label>
    <select id="viewCount">
      <option value="2">2 sermons</option>
      <option value="3" selected>3 sermons</option>
    </select>
    <button id="expandAll">Expand all stages</button>
    <button id="collapseAll">Collapse all stages</button>
  </div>

  <div class="board" id="board"></div>
</div>

<script>
/* ---------- the checklist data ---------- */
const STAGES = [
  {

    blocks:[

        "Does your main idea line up with the commentary's main idea of the passage?",

        "Write out the text by hand.",

        "Look at the text from different perspectives: a woman, an Ethiopian, an atheist, a child, a Jew, a young man, a college student, a retiree.",
        "Go over each word and ask, what would change if this word were not here?",
        "Look for S.P.E.C.K.S.: Sins to avoid, Promises to claim, Examples to follow, Commands to obey, something to Know about God, something to Share.",
        "Read other faithful versions (NASB, ESV, CSB, KJV, NIV).",
        "Look through the cross references."
      ]},
      {k:"task", t:"Talk through key thoughts and illustrations with a friend for critical feedback."},
      {k:"task", t:"Revise your outline, Know/Feel/Do, and thesis in light of your research."},
      {k:"quote", html:"The temptation is to shortcut this process, to try to figure out how to say it before we know what it says. We are not preaching sermons, we are preaching texts. We are re-presenting what God said. The secret of great preaching is often little more than staying at it until the meaning of the text is clear.", cite:"Steven Smith, Recapturing the Voice of God"},

      {k:"note", html:"One thesis takes a main idea of the text and applies it to people's lives. Each section builds on that idea, pressing it home further toward the conclusion."},

        "Keep what serves the section's point and cut what does not."
      ]},

        "Keep what serves the theme and cut what contributes least."

        desc:"These move from mind to heart to hands, the order each section can follow. Know = explanation. Feel = illustration. Do = application."},
      {k:"task", t:"About one story per heading?"},
      {k:"task", t:"Application throughout?"},
      {k:"task", t:"Fill the outline with Scripture using cross references (TSK, Topical Bible). This is the secret of Piper's and MacArthur's timeless preaching: it is full of the word of God."},

      {k:"task", t:"Total length about 1,600 to 3,000 words, or 8 pages."},
      {k:"task", t:"PowerPoint.", note:"Create your slides. Stephanie sends the main deck; add your sermon slides and send to Corey at <a href='mailto:tbc.edwardsburg@gmail.com'>tbc.edwardsburg@gmail.com</a>."}

  {
    key:"rehearse", cls:"rehearse", emoji:"🎤", title:"Stage Three: Rehearsing",
    blocks:[
      {k:"note", html:"Let the message marinate and soak in. Pray it would bless specific people across life stages and situations: lost and saved, weak and mature, mothers and fathers, single, sick, divorced, retired, proud and humble, foreigners and locals."},
      {k:"task", t:"Practice.", subs:[
        "Practice your intro twice.",
        "Practice your conclusion twice.",
        "Conversate it with a friend. Do not read a manuscript; talk through your outline and ask for feedback.",
        "Turn your outline into pictures, recall it without notes, or record 3 to 5 minutes of a key section and listen back."
      ]},
      {k:"task", t:"Make revisions in light of feedback."},
      {k:"task", t:"Memorize the outline, not the manuscript."},

        "Keep a backup on your phone. Email it to yourself."

];

/* ---------- state ---------- */
const STORE_KEY = "sermonPrepBoard.v1";
const SLOTS = 3;
let state = load();
function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function slotState(s){
  if(!state[s]) state[s] = {meta:{title:"",passage:"",date:""}, checks:{}};
  if(!state[s].meta) state[s].meta = {title:"",passage:"",date:""};
  if(!state[s].checks) state[s].checks = {};
  return state[s];
}

/* ---------- stage collapse memory (remembers expanded/collapsed per column+stage) ---------- */
const STAGE_OPEN_KEY = STORE_KEY + ".stageopen";
let stageOpen = {};
try{ stageOpen = JSON.parse(localStorage.getItem(STAGE_OPEN_KEY)) || {}; }
catch(e){ stageOpen = {}; }
function stageOpenId(slot, stageKey){ return slot + ":" + stageKey; }
function isStageOpen(slot, stageKey){
  const id = stageOpenId(slot, stageKey);
  return Object.prototype.hasOwnProperty.call(stageOpen, id) ? stageOpen[id] : true; // default: open
}
function setStageOpen(slot, stageKey, isOpen){
  stageOpen[stageOpenId(slot, stageKey)] = isOpen;
  localStorage.setItem(STAGE_OPEN_KEY, JSON.stringify(stageOpen));
}
function persistStageOpenState(){
  document.querySelectorAll('.col').forEach(function(col){
    col.querySelectorAll('details.stage[data-stage]').forEach(function(d){
      setStageOpen(col.dataset.slot, d.dataset.stage, d.open);
    });
  });
}

/* ---------- render ---------- */
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderTask(item, ctr, slot){
  const isObj = typeof item === "object";
  const text = isObj ? item.t : item;
  const note = isObj ? item.note : null;
  const subs = isObj ? item.subs : null;
  const id = "cb" + (ctr.n++);
  let html = '<li class="task" data-row="'+id+'">';
  html += '<label class="cb"><span class="box" data-cb="'+id+'"></span><span class="txt">'+esc(text)+'</span></label>';
  if(note){ html += '<div class="subnote">'+note+'</div>'; }
  if(subs && subs.length){
    html += '<ul class="tasks">';
    subs.forEach(function(sub){ html += renderTask(sub, ctr, slot); });
    html += '</ul>';
  }
  html += '</li>';
  return html;
}

function renderStage(stage, ctr, slot){
  let body = "";
  let openList = false;
  function closeList(){ if(openList){ body += '</ul>'; openList = false; } }
  stage.blocks.forEach(function(b){
    if(b.k === "task"){
      if(!openList){ body += '<ul class="tasks">'; openList = true; }
      body += renderTask(b, ctr, slot);
    } else {
      closeList();
      if(b.k === "note"){ body += '<div class="note">'+b.html+'</div>'; }
      else if(b.k === "quote"){ body += '<blockquote class="q">'+b.html + (b.cite ? '<span class="cite">'+esc(b.cite)+'</span>' : '') + '</blockquote>'; }
      else if(b.k === "phase"){ body += '<div class="phase">'+b.title + (b.desc ? '<span class="desc">'+esc(b.desc)+'</span>' : '') + '</div>'; }
      else if(b.k === "head"){ body += '<div class="phase">'+esc(b.title) + (b.desc ? '<span class="desc">'+esc(b.desc)+'</span>' : '') + '</div>'; }
      else if(b.k === "secthead"){ body += '<div class="secthead">'+esc(b.title)+'</div>'; }
    }
  });
  closeList();
  const openAttr = isStageOpen(slot, stage.key) ? ' open' : '';
  return '<details class="stage '+stage.cls+'" data-stage="'+stage.key+'"'+openAttr+'><summary><span class="chev">▶</span><span>'+stage.emoji+' '+esc(stage.title)+'</span></summary><div class="stage-inner">'+body+'</div></details>';
}

function renderColumn(slot){
  const ctr = {n:0};
  let stagesHtml = "";
  STAGES.forEach(function(st){ stagesHtml += renderStage(st, ctr, slot); });
  const total = ctr.n;
  const ss = slotState(slot);
  const col = document.createElement("div");
  col.className = "col";
  col.dataset.slot = slot;
  col.dataset.total = total;
  col.innerHTML =
    '<div class="col-head">'+
      '<input class="title" data-field="title" placeholder="Sermon title" value="'+esc(ss.meta.title)+'">'+
      '<div class="metarow">'+
        '<input data-field="passage" placeholder="Passage (e.g. Acts 3:1-16)" value="'+esc(ss.meta.passage)+'">'+
        '<input class="date" type="date" data-field="date" value="'+esc(ss.meta.date)+'">'+
      '</div>'+
      '<div class="progwrap"><div class="progbar"><div class="progfill"></div></div>'+
      '<div class="progtext"><span class="ptlabel">Progress</span><span class="ptcount">0 / '+total+'</span></div></div>'+
      '<div class="col-actions"><button data-act="toggle">Collapse stages</button><button data-act="reset">Reset column</button></div>'+
    '</div>'+
    '<div class="col-body">'+stagesHtml+'</div>';
  return col;
}

function applyChecks(col){
  const slot = col.dataset.slot;
  const ss = slotState(slot);
  col.querySelectorAll('.box[data-cb]').forEach(function(box){
    const v = ss.checks[box.dataset.cb] || 0;   // 0 none, 1 done, 2 skipped
    const row = box.closest('li.task');
    if(row){ row.classList.toggle('done', v===1); row.classList.toggle('skip', v===2); }
  });
  updateProgress(col);
}

function updateProgress(col){
  const total = parseInt(col.dataset.total,10) || 0;
  const done = col.querySelectorAll('li.task.done, li.task.skip').length;
  const pct = total ? Math.round(done/total*100) : 0;
  col.querySelector('.progfill').style.width = pct + "%";
  col.querySelector('.ptcount').textContent = done + " / " + total;
  col.querySelector('.ptlabel').textContent = pct + "% done";
}

/* ---------- build board ---------- */
const board = document.getElementById("board");
for(let s=0; s<SLOTS; s++){
  const col = renderColumn(s);
  board.appendChild(col);
  applyChecks(col);
  col.querySelectorAll('details.stage[data-stage]').forEach(function(d){
    d.addEventListener('toggle', function(){ setStageOpen(col.dataset.slot, d.dataset.stage, d.open); });
  });
}

/* ---------- events ---------- */
// shared toggle: none -> done -> skipped -> none
function toggleOne(col, id, originEl){
  const ss = slotState(col.dataset.slot);
  const cur = ss.checks[id] || 0;
  const next = cur === 0 ? 1 : (cur === 1 ? 2 : 0);
  if(next === 0) delete ss.checks[id]; else ss.checks[id] = next;
  const row = col.querySelector('li.task[data-row="'+id+'"]');
  if(row){ row.classList.toggle('done', next===1); row.classList.toggle('skip', next===2); }
  updateProgress(col);
  save();
  if(next === 1 && originEl){
    const p = cfPagePos(originEl);
    confettiBurst(p.x, p.y, {count:18, spread:70, power:7, size:6});
    const total = parseInt(col.dataset.total,10) || 0;
    const done = col.querySelectorAll('li.task.done, li.task.skip').length;
    if(total && done === total){ celebrate(p.x, p.y); }
  }
}

// clicking the checkbox square itself toggles that one item, no effect on the highlight
board.addEventListener("click", function(e){
  if(e.target.closest('a')) return;
  if(document.body.classList.contains('readonly')) return;
  const box = e.target.closest('.box[data-cb]');
  if(!box) return;
  const col = box.closest('.col');
  toggleOne(col, box.dataset.cb, box);
});

/* ---------- multi-select (click the label text) + Enter to cycle them all ---------- */
// Plain click on a task's text toggles it (same as clicking the box) and highlights just that
// row. Shift+click highlights the range from the last-clicked row without toggling anything.
// Ctrl/Cmd+click adds or removes just that row from the highlight, also without toggling.
// Press Enter to advance every highlighted row one step, Escape to clear the highlight.
const selection = {};              // slot -> Set of row ids currently highlighted
const selAnchor = {};              // slot -> id of the last plain/shift click, for range selection
function getSelection(slot){ if(!selection[slot]) selection[slot] = new Set(); return selection[slot]; }
function rowOrder(col){ return Array.prototype.map.call(col.querySelectorAll('.box[data-cb]'), function(b){ return b.dataset.cb; }); }
function setRowSelected(col, id, on){
  const sel = getSelection(col.dataset.slot);
  if(on) sel.add(id); else sel.delete(id);
  const row = col.querySelector('li.task[data-row="'+id+'"]');
  if(row) row.classList.toggle('selected', on);
}
function clearSelection(col){
  getSelection(col.dataset.slot).clear();
  col.querySelectorAll('li.task.selected').forEach(function(row){ row.classList.remove('selected'); });
}

board.addEventListener("click", function(e){
  if(document.body.classList.contains('readonly')) return;
  const txt = e.target.closest('.txt');
  if(!txt) return;
  const row = txt.closest('li.task');
  const col = row.closest('.col');
  const slot = col.dataset.slot;
  const id = row.dataset.row;
  const order = rowOrder(col);
  if(e.shiftKey && selAnchor[slot]){
    const a = order.indexOf(selAnchor[slot]);
    const b = order.indexOf(id);
    if(a > -1 && b > -1){
      clearSelection(col);
      const lo = Math.min(a,b), hi = Math.max(a,b);
      for(let i=lo; i<=hi; i++) setRowSelected(col, order[i], true);
    }
  } else if(e.metaKey || e.ctrlKey){
    setRowSelected(col, id, !getSelection(slot).has(id));
    selAnchor[slot] = id;
  } else {
    clearSelection(col);
    setRowSelected(col, id, true);
    selAnchor[slot] = id;
    const box = row.querySelector('.box[data-cb]');
    toggleOne(col, id, box);
  }
  e.preventDefault();
});

document.addEventListener("keydown", function(e){
  if(document.body.classList.contains('readonly')) return;
  if(e.key === "Escape"){
    document.querySelectorAll('.col').forEach(clearSelection);
    return;
  }
  if(e.key !== "Enter") return;
  const active = document.activeElement;
  if(active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) return; // typing in title/passage/date
  let touched = false;
  document.querySelectorAll('.col').forEach(function(col){
    const slot = col.dataset.slot;
    const sel = getSelection(slot);
    if(!sel.size) return;
    touched = true;
    const ss = slotState(slot);
    sel.forEach(function(id){
      const cur = ss.checks[id] || 0;
      const next = cur === 0 ? 1 : (cur === 1 ? 2 : 0);
      if(next === 0) delete ss.checks[id]; else ss.checks[id] = next;
      const row = col.querySelector('li.task[data-row="'+id+'"]');
      if(row){ row.classList.toggle('done', next===1); row.classList.toggle('skip', next===2); }
    });
    updateProgress(col);
  });
  if(touched){ save(); e.preventDefault(); }
});

board.addEventListener("input", function(e){
  const f = e.target.closest('[data-field]');
  if(!f) return;
  const col = e.target.closest('.col');
  const ss = slotState(col.dataset.slot);
  ss.meta[f.dataset.field] = f.value;
  save();
});

board.addEventListener("click", function(e){
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const col = e.target.closest('.col');
  if(btn.dataset.act === "reset"){
    if(confirm("Clear all checkmarks for this sermon? The title and passage stay.")){
      slotState(col.dataset.slot).checks = {};
      save();
      applyChecks(col);
    }
  } else if(btn.dataset.act === "toggle"){
    const details = col.querySelectorAll('details.stage');
    const anyOpen = Array.prototype.some.call(details, d=>d.open);
    details.forEach(d=> d.open = !anyOpen);
    btn.textContent = anyOpen ? "Expand stages" : "Collapse stages";
    persistStageOpenState();
  }
});

/* ---------- toolbar ---------- */
const viewCount = document.getElementById("viewCount");
function applyView(){
  const n = parseInt(viewCount.value,10);
  document.querySelectorAll('.col').forEach(function(col,i){
    col.classList.toggle('hidden', i >= n);
  });
  localStorage.setItem(STORE_KEY + ".view", String(n));
}
const savedView = localStorage.getItem(STORE_KEY + ".view");
if(savedView){ viewCount.value = savedView; }
viewCount.addEventListener("change", applyView);
applyView();

document.getElementById("expandAll").addEventListener("click", function(){
  document.querySelectorAll('details.stage').forEach(d=> d.open = true);
  persistStageOpenState();
});
document.getElementById("collapseAll").addEventListener("click", function(){
  document.querySelectorAll('details.stage').forEach(d=> d.open = false);
  persistStageOpenState();
});

/* ---------- confetti (self contained, no libraries) ---------- */
const cfCanvas = document.createElement("canvas");
cfCanvas.style.cssText = "position:absolute;left:0;top:0;pointer-events:none;z-index:9999";
document.body.appendChild(cfCanvas);
const cfCtx = cfCanvas.getContext("2d");
let cfParticles = [], cfRAF = null;
const CF_COLORS = ["#b08948","#caa463","#3f7d57","#4a5da8","#9a4a4a","#e9dcbf"];
function cfSize(){
  cfCanvas.style.width = "0px"; cfCanvas.style.height = "0px";
  const d = document.documentElement, b = document.body;
  const w = Math.max(d.scrollWidth, d.clientWidth, b ? b.scrollWidth : 0);
  const h = Math.max(d.scrollHeight, d.clientHeight, b ? b.scrollHeight : 0);
  cfCanvas.width = w; cfCanvas.height = h;
  cfCanvas.style.width = w + "px"; cfCanvas.style.height = h + "px";
}
function cfPagePos(el){
  const r = el.getBoundingClientRect();
  const sx = window.scrollX || window.pageXOffset || 0;
  const sy = window.scrollY || window.pageYOffset || 0;
  return { x: r.left + r.width/2 + sx, y: r.top + r.height/2 + sy };
}
window.addEventListener("resize", cfSize);

function confettiBurst(x, y, opt){
  opt = opt || {};
  cfSize();
  const count = opt.count || 16;
  const power = opt.power || 7;
  const spread = (opt.spread || 60) * Math.PI/180;
  const baseAngle = (opt.angle != null) ? opt.angle : -Math.PI/2;
  const size = opt.size || 6;
  for(let i=0;i<count;i++){
    const a = baseAngle + (Math.random()-0.5)*spread;
    const v = power*(0.6 + Math.random()*0.8);
    cfParticles.push({
      x:x, y:y,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      g:0.18 + Math.random()*0.08, drag:0.985,
      size:size*(0.7 + Math.random()*0.7),
      color:CF_COLORS[(Math.random()*CF_COLORS.length)|0],
      rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      life:0, max:70 + Math.random()*40
    });
  }
  if(!cfRAF) cfRAF = requestAnimationFrame(cfTick);
}

function celebrate(px, py){
  confettiBurst(px - 60, py, {count:75, power:12, spread:80, size:8});
  confettiBurst(px + 60, py, {count:75, power:12, spread:80, size:8});
  confettiBurst(px,      py - 20, {count:95, power:13, spread:175, size:8});
  banner("Sermon ready. Well done.", px, py);
}

function cfTick(){
  cfCtx.clearRect(0,0,cfCanvas.width,cfCanvas.height);
  for(let i=cfParticles.length-1;i>=0;i--){
    const p = cfParticles[i];
    p.vx *= p.drag; p.vy = p.vy*p.drag + p.g;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    const alpha = p.life > p.max ? Math.max(0, 1-(p.life-p.max)/20) : 1;
    cfCtx.save();
    cfCtx.globalAlpha = alpha;
    cfCtx.translate(p.x, p.y); cfCtx.rotate(p.rot);
    cfCtx.fillStyle = p.color;
    cfCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
    cfCtx.restore();
    if(p.y > cfCanvas.height + 30 || alpha <= 0) cfParticles.splice(i,1);
  }
  if(cfParticles.length){ cfRAF = requestAnimationFrame(cfTick); }
  else { cfCtx.clearRect(0,0,cfCanvas.width,cfCanvas.height); cfRAF = null; }
}

function banner(text, px, py){
  const b = document.createElement("div");
  b.textContent = text;
  b.style.cssText = "position:absolute;z-index:10000;left:"+px+"px;top:"+(py-64)+"px;transform:translate(-50%,0) scale(.85);white-space:nowrap;"+
    "background:rgba(255,253,248,.97);border:1px solid #e4ddcc;border-radius:12px;padding:10px 18px;"+
    "font-family:Georgia,serif;font-size:17px;color:#b08948;box-shadow:0 8px 26px rgba(60,50,30,.2);"+
    "opacity:0;transition:opacity .25s, transform .25s;pointer-events:none";
  document.body.appendChild(b);
  requestAnimationFrame(function(){ b.style.opacity="1"; b.style.transform="translate(-50%,0) scale(1)"; });
  setTimeout(function(){ b.style.opacity="0"; b.style.transform="translate(-50%,0) scale(.92)"; setTimeout(function(){ b.remove(); }, 320); }, 2200);
}

/* ---------- shared board (GitHub-native) + subtle edit gate ---------- */
(function(){
  // ===== config =====
  const OWNER  = "GebSierra";
  const REPO   = "MonthlyObjectives";
  const BRANCH = "main";
  const FILE   = "sermon-progress.json";
  // ==================
  const RAW_URL = FILE; // same folder on the Pages site: public, tokenless read
  const API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + FILE;
  const TOKEN_KEY = STORE_KEY + ".ghtoken";

  const params = new URLSearchParams(location.search);

  const st = document.createElement("style");
  st.textContent =
    "body.readonly .col-actions{display:none}" +
    "body.readonly label.cb{cursor:default}" +
    ".col input:disabled{opacity:1}" +
    "#editbar{position:fixed;right:10px;top:8px;z-index:10001;font-size:11px;color:#9a948a;display:flex;gap:10px;align-items:center}" +
    "#editbar a{color:#bdb6a8;text-decoration:none;border-bottom:1px dotted #cfc8ba;cursor:pointer}";
  document.head.appendChild(st);

  const bar = document.createElement("div");
  bar.id = "editbar";
  const statusEl = document.createElement("span");
  const editLink = document.createElement("a");
  editLink.textContent = "edit";
  editLink.href = "#";
  bar.appendChild(statusEl); bar.appendChild(editLink);
  document.body.appendChild(bar);
  function setStatus(t){ statusEl.textContent = t; }

  function refreshAll(){
    document.querySelectorAll(".col").forEach(function(col){
      const ss = slotState(col.dataset.slot);
      const ti = col.querySelector('[data-field="title"]'); if(ti) ti.value = ss.meta.title || "";
      const p = col.querySelector('[data-field="passage"]'); if(p) p.value = ss.meta.passage || "";
      const d = col.querySelector('[data-field="date"]'); if(d) d.value = ss.meta.date || "";
      applyChecks(col);
    });
  }

  let editing = false;
  function setReadOnly(on){
    document.body.classList.toggle("readonly", on);
    document.querySelectorAll(".col input").forEach(function(i){ i.disabled = on; });
  }
  setReadOnly(true); // everyone starts read-only; elders never leave it

  let token = localStorage.getItem(TOKEN_KEY) || "";
  let sha = null;

  function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
  function b64decode(s){ return decodeURIComponent(escape(atob(String(s).replace(/\s/g,"")))); }

  // public read (no token): read the committed file from the same site
  function pull(){
    fetch(RAW_URL + "?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(remote){
        if(remote && typeof remote === "object"){ state = remote; refreshAll(); setStatus("up to date"); }
        else setStatus("no data yet");
      })
      .catch(function(){ setStatus("offline"); });
  }

  // authenticated read to get the current sha (and latest content) before editing
  function loadForEdit(){
    setStatus("loading");
    fetch(API + "?ref=" + BRANCH, {headers:{Authorization:"Bearer "+token, Accept:"application/vnd.github+json"}, cache:"no-store"})
      .then(function(r){
        if(r.status === 404){ sha = null; setStatus("editing (new file)"); return null; }
        if(r.status === 401){ throw new Error("bad token"); }
        if(!r.ok){ throw new Error("load failed"); }
        return r.json();
      })
      .then(function(j){
        if(j){ sha = j.sha; try{ const remote = JSON.parse(b64decode(j.content)); if(remote && typeof remote === "object"){ state = remote; refreshAll(); } }catch(e){} setStatus("editing"); }
      })
      .catch(function(err){
        if(err && err.message === "bad token"){
          localStorage.removeItem(TOKEN_KEY); token=""; editing=false; setReadOnly(true); editLink.textContent="edit";
          alert("That token was rejected. Click edit to try again."); setStatus("read only");
        } else setStatus("load error");
      });
  }

  let pushing=false, again=false, timer=null;
  function push(){
    if(!token) return;
    if(pushing){ again = true; return; }
    pushing = true; setStatus("saving");
    const body = { message:"Update sermon progress", content: b64encode(JSON.stringify(state)), branch: BRANCH };
    if(sha) body.sha = sha;
    fetch(API, {method:"PUT", headers:{Authorization:"Bearer "+token, Accept:"application/vnd.github+json","Content-Type":"application/json"}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
      .then(function(res){
        pushing = false;
        if(res.status < 300 && res.j && res.j.content){ sha = res.j.content.sha; setStatus("saved"); if(again){ again=false; schedule(); } }
        else if(res.status === 409){ setStatus("syncing"); refetchShaThenPush(); }
        else { setStatus("save error"); }
      })
      .catch(function(){ pushing=false; setStatus("offline"); });
  }
  function refetchShaThenPush(){
    fetch(API + "?ref=" + BRANCH, {headers:{Authorization:"Bearer "+token, Accept:"application/vnd.github+json"}, cache:"no-store"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(j){ sha = j.sha; } schedule(); });
  }
  function schedule(){ clearTimeout(timer); timer = setTimeout(push, 800); }

  // ticking (and meta edits) save locally, and push while editing
  const _save = save;
  save = function(){ _save(); if(editing) schedule(); };

  function enableEdit(){
    if(!token){
      const t = window.prompt("Paste your GitHub edit token. It is stored only in this browser and never published.");
      if(!t) return;
      token = t.trim(); localStorage.setItem(TOKEN_KEY, token);
    }
    editing = true; setReadOnly(false); editLink.textContent = "editing";
    loadForEdit();
  }

  editLink.addEventListener("click", function(e){ e.preventDefault(); if(!editing) enableEdit(); });

  // open with ?edit=1 to go straight into editing
  if(params.get("edit") === "1") enableEdit();

  // first load + gentle polling so viewers stay current
  pull();
  setInterval(function(){ if(!editing) pull(); }, 30000);
})();
</script>
