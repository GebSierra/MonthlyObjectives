<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>God's KINGDOM Plan</title>
<meta name="description" content="Seven stages of the story of God's glory in Christ, shown as an interactive KINGDOM figure with a quiz.">
<style>
/* ---------- Tokens ---------- */
:root {
  --blue: #0B6FAE;
  --blue-deep: #085A8E;
  --bg: #FFFFFF;
  --ink: #1A2230;
  --muted: #5B6575;
  --panel: #F2F7FB;
  --line: #D5E1EC;
  --focus: #FFC94D;
  --ok: #17703F;
  --ok-bg: #E2F4E9;
  --bad: #B3261E;
  --bad-bg: #FBE6E4;
  --shadow: 0 10px 40px rgba(16, 36, 58, .22);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --blue: #1A82C4;
    --blue-deep: #1470AB;
    --bg: #0E1520;
    --ink: #E6EDF5;
    --muted: #9FB0C2;
    --panel: #162231;
    --line: #27394D;
    --ok: #6FD79B;
    --ok-bg: #12301F;
    --bad: #FF9188;
    --bad-bg: #3C1A18;
    --shadow: 0 10px 40px rgba(0, 0, 0, .55);
  }
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  box-shadow: 0 0 0 2px #1A2230;
}
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 24px; }

/* Icons: one sprite, two looks. Solid by default, dotted outline when .promised.
   The --s / --o custom properties flow into the <use> shadow tree. */
svg.ic { display: block; width: 100%; height: 100%; fill: currentColor; overflow: visible; }
.s { display: var(--s, inline); }
.o { display: var(--o, none); }
svg.ic.promised {
  --s: none;
  --o: inline;
  fill: none;
  stroke: currentColor;
  stroke-width: var(--pw, 2.6);
  stroke-dasharray: 0.1 var(--pd, 5);
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- Header and toolbar ---------- */
header { text-align: center; padding: 28px 0 8px; }
h1 { margin: 0 0 6px; font-size: clamp(26px, 5vw, 40px); line-height: 1.15; letter-spacing: -.01em; }
.sub { margin: 0 auto 18px; max-width: 46em; color: var(--muted); font-size: clamp(15px, 2.4vw, 18px); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pillbtn {
  border: 2px solid var(--blue); background: transparent; color: var(--blue);
  border-radius: 999px; padding: 6px 18px; font-weight: 700; font-size: 15px;
  transition: background .15s, color .15s;
}
.pillbtn:hover { background: var(--panel); }
.pillbtn[aria-pressed="true"] { background: var(--blue); color: #fff; }
.pillbtn[aria-pressed="true"]:hover { background: var(--blue-deep); border-color: var(--blue-deep); }

/* ---------- Layout: main + side panel ---------- */
.layout { display: flex; align-items: flex-start; margin-top: 18px; }
main { flex: 1 1 auto; min-width: 0; container-type: inline-size; }

/* ---------- Board ---------- */
.board {
  --w: clamp(34px, min(12cqw, calc(100cqw / 7.6)), 130px);
  --pw: 2.4; --pd: 4.8;
  display: grid;
  grid-template-columns: repeat(7, var(--w));
  gap: calc(var(--w) * .1);
  justify-content: center;
  align-items: start;
  padding: 6px 0 20px;
}
@container (max-width: 560px) { .board { --pw: 3; --pd: 7; } }
.col { display: flex; flex-direction: column; align-items: center; transition: opacity .25s; }
.tile {
  width: var(--w); height: var(--w);
  display: grid; place-items: center;
  border: 0; border-radius: calc(var(--w) * .22);
  background: var(--blue); color: #fff;
  font-weight: 700; font-size: calc(var(--w) * .62); line-height: 1;
  padding: 0 0 calc(var(--w) * .03);
  transition: background .15s, transform .15s;
}
.tile:hover, .tile:focus-visible { background: var(--blue-deep); }
.col.sel .tile { background: var(--blue-deep); }
.pill {
  --r: calc(var(--w) / 2);
  width: var(--w);
  margin-top: calc(var(--w) * .035);
  padding: calc(var(--w) * .01) 0;
  background: var(--blue); color: #fff;
  border-radius: var(--r);
  display: flex; flex-direction: column; align-items: center;
}
.ico {
  position: relative;
  width: calc(var(--w) * .78); height: calc(var(--w) * .78);
  margin: calc(var(--w) * .11) 0;
  padding: 0; border: 0; background: transparent; color: inherit;
  border-radius: 50%;
  transition: transform .15s, opacity .2s, background .2s, box-shadow .2s;
}
.ico svg.ic { width: 100%; height: 100%; }
.ico:hover, .ico:focus-visible { transform: scale(1.12); }

/* Highlight state while an icon or stage is selected */
.board.stage-mode .col:not(.sel) { opacity: .35; }
.board.icon-mode .ico:not(.hit) { opacity: .25; }
.board.icon-mode .tile { opacity: .55; }
.ico.hit {
  background: rgba(255, 255, 255, .16);
  box-shadow: 0 0 0 calc(var(--w) * .035) #fff, 0 0 calc(var(--w) * .18) rgba(255, 255, 255, .55);
}
.ico.cur { background: rgba(255, 255, 255, .3); }

/* Tooltip */
#tip {
  position: fixed; z-index: 60; pointer-events: none;
  background: #1A2230; color: #fff; border-radius: 8px;
  padding: 4px 10px; font-size: 13px; line-height: 1.35; max-width: 240px; text-align: center;
  opacity: 0; transition: opacity .12s;
}
#tip.show { opacity: 1; }

/* ---------- Intro animation ---------- */
@keyframes drop { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: none; } }
@keyframes unroll { from { clip-path: inset(0 0 100% 0 round var(--r)); } to { clip-path: inset(0 0 0 0 round var(--r)); } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes hop { 0%, 100% { transform: none; } 40% { transform: translateY(-22%); } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.board.intro .tile { animation: drop 420ms cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i) * 70ms); }
.board.intro .pill { --cd: calc(350ms + var(--i) * 90ms); animation: unroll 600ms cubic-bezier(.3, .7, .3, 1) both; animation-delay: var(--cd); }
.board.intro .ico svg.ic { animation: pop 300ms cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--cd) + 150ms + var(--j) * 60ms); }
.wave .mini { animation: hop 520ms ease-in-out both; animation-delay: calc(var(--i) * 80ms); }
.shake { animation: shake 320ms; }

/* ---------- Side panel ---------- */
.panel {
  position: sticky; top: 12px; flex: 0 0 auto;
  width: 0; margin-left: 0; opacity: 0; visibility: hidden; overflow: hidden;
  background: var(--panel); border-radius: 18px;
  transition: width .3s ease, margin-left .3s ease, opacity .2s, visibility 0s .3s;
}
.panel.open {
  width: 420px; margin-left: 16px; opacity: 1; visibility: visible;
  box-shadow: var(--shadow);
  transition: width .3s ease, margin-left .3s ease, opacity .2s, visibility 0s;
}
.panel-inner { width: 420px; max-height: min(calc(100vh - 24px), 780px); overflow-y: auto; overscroll-behavior: contain; }
.panel-bar {
  position: sticky; top: 0; z-index: 2;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.nav { display: flex; gap: 6px; }
.navbtn, .closebtn {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 600; min-height: 34px;
}
.navbtn:hover:not(:disabled), .closebtn:hover { border-color: var(--blue); color: var(--blue); }
.navbtn:disabled { opacity: .4; cursor: default; }
.closebtn { width: 36px; padding: 0; font-size: 22px; line-height: 1; }
.panel-body { padding: 16px 20px 24px; }
.panel-body h2 { margin: 0; font-size: 22px; line-height: 1.25; }
.panel-body h2:focus { outline: none; }
.panel-body p { margin: 0 0 12px; }
.p-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.bigletter {
  flex: none; width: 68px; height: 68px; display: grid; place-items: center;
  background: var(--blue); color: #fff; border-radius: 15px; font-size: 44px; font-weight: 700; line-height: 1; padding-bottom: 3px;
}
.eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.facts { margin: 0 0 14px; padding: 0; list-style: none; font-size: 15px; }
.facts li { margin: 2px 0; }
.facts b { color: var(--muted); font-weight: 700; }
.panel-body h3 { margin: 18px 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chip {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 999px; padding: 3px 11px; font-size: 14px;
}
button.chip:hover { border-color: var(--blue); color: var(--blue); }
button.chip[aria-current="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.mini-icons { display: flex; flex-wrap: wrap; gap: 8px; }
.mini-ico {
  width: 52px; height: 52px; padding: 8px; border: 0; border-radius: 14px;
  background: var(--blue); color: #fff; transition: transform .15s;
}
.mini-ico:hover { transform: scale(1.08); }
.mini-ico svg.ic { --pw: 3.6; --pd: 6.5; }
.icon-hero {
  width: 132px; height: 132px; padding: 22px; margin: 0 0 14px;
  background: var(--panel); color: var(--blue); border-radius: 22px; border: 1px solid var(--line);
}
.panel-body .icon-hero { background: var(--bg); }
.icon-hero svg.ic { --pw: 2.6; --pd: 5; }
.badge { display: inline-block; margin: 8px 0 12px; padding: 2px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.badge.promised { border: 2px dotted var(--blue); color: var(--blue); }
.badge.fulfilled { background: var(--blue); color: #fff; border: 2px solid var(--blue); }
.note { font-size: 17px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--blue-deep); }
.backdrop { display: none; }

@media (max-width: 899px) {
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 50;
    width: auto; margin: 0; opacity: 1;
    border-radius: 18px 18px 0 0;
    transform: translateY(105%);
    transition: transform .3s ease, visibility 0s .3s;
  }
  .panel.open { width: auto; margin: 0; transform: none; transition: transform .3s ease, visibility 0s; }
  .panel-inner { width: auto; max-height: 80vh; max-height: 80dvh; }
  .backdrop { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(10, 20, 32, .4); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
  .backdrop.show { opacity: 1; visibility: visible; transition: opacity .25s; }
}

/* ---------- Legend ---------- */
.legend { max-width: 900px; margin: 8px auto 24px; padding: 20px; background: var(--panel); border-radius: 18px; }
.legend h2 { margin: 0 0 10px; font-size: 20px; }
.legend-key { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; color: var(--ink); }
.legend-key .pair { display: flex; gap: 8px; }
.legend-key .swatch { width: 60px; height: 60px; padding: 9px; background: var(--blue); color: #fff; border-radius: 12px; }
.legend-key .swatch svg.ic { --pw: 3.6; --pd: 6.5; }
.legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; padding: 0; list-style: none; }
@media (max-width: 640px) { .legend-grid { grid-template-columns: 1fr; } }
.legend-item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 8px 12px 8px 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 14px;
  transition: border-color .15s, transform .15s;
}
.legend-item:hover { border-color: var(--blue); transform: translateY(-1px); }
.legend-item .swatch { flex: none; width: 48px; height: 48px; padding: 8px; background: var(--blue); color: #fff; border-radius: 12px; }
.legend-item .swatch svg.ic { --pw: 3.6; --pd: 6.5; }

/* ---------- Quiz ---------- */
.card { max-width: 680px; margin: 8px auto 24px; padding: 24px; background: var(--panel); border-radius: 20px; }
.card h2 { margin: 0 0 6px; font-size: 24px; line-height: 1.25; }
.card h2:focus { outline: none; }
.card .lead { margin: 0 0 18px; color: var(--muted); }
.choices { display: grid; gap: 10px; }
.choice {
  text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); transition: border-color .15s, transform .15s;
}
.choice:hover { border-color: var(--blue); transform: translateY(-1px); }
.choice b { display: block; font-size: 18px; }
.choice span { color: var(--muted); font-size: 14px; }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 6px 0 16px; }
.progress > i { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width .3s; }
.qmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; font-weight: 700; }
.qicon { width: 120px; height: 120px; padding: 18px; margin: 4px 0 12px; background: var(--blue); color: #fff; border-radius: 22px; }
.opts { display: grid; gap: 10px; margin: 16px 0; }
.opt {
  display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink);
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt:disabled { cursor: default; }
.opt .num { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: var(--panel); color: var(--muted); font-size: 13px; font-weight: 700; }
.opt .mark { margin-left: auto; font-weight: 700; font-size: 18px; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.right .mark { color: var(--ok); }
.opt.wrong .mark { color: var(--bad); }
.feedback { min-height: 3em; margin: 0 0 12px; }
.feedback strong.good { color: var(--ok); }
.feedback strong.bad { color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.primary { border: 2px solid var(--blue); background: var(--blue); color: #fff; border-radius: 999px; padding: 8px 22px; font-weight: 700; }
.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); }
.secondary { border: 2px solid var(--blue); background: transparent; color: var(--blue); border-radius: 999px; padding: 8px 22px; font-weight: 700; }
.secondary:hover { background: var(--bg); }
.score { font-size: 54px; font-weight: 700; line-height: 1.1; margin: 4px 0; color: var(--blue); }
.missed { margin: 12px 0 18px; padding-left: 22px; }
.missed li { margin: 0 0 10px; }
.missed small { display: block; color: var(--muted); }
.mini-row { display: flex; gap: 6px; justify-content: center; margin: 4px 0 14px; }
.mini { width: 36px; height: 36px; display: grid; place-items: center; background: var(--blue); color: #fff; border-radius: 9px; font-weight: 700; font-size: 22px; }
.mini.big { width: 72px; height: 72px; border-radius: 16px; font-size: 44px; margin: 4px 0 12px; }
.typein { display: grid; gap: 6px; margin: 16px 0; }
.typein label { font-weight: 700; font-size: 14px; color: var(--muted); }
.typein input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; }
.typein input:focus-visible { border-color: var(--blue); }
.typein input.right { border-color: var(--ok); background: var(--ok-bg); }
.typein input.wrong { border-color: var(--bad); background: var(--bad-bg); }
.typein .actions { margin-top: 6px; align-items: center; }
.typein .primary:disabled { opacity: .5; cursor: default; }
.hint-mask { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; letter-spacing: .08em; font-weight: 700; color: var(--blue); overflow-wrap: anywhere; }
.order { display: grid; gap: 8px; margin: 14px 0; padding: 0; list-style: none; }
.slot { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px; border: 2px dashed var(--line); border-radius: 14px; }
.slot .mini { flex: none; }
.slot.filled { border: 2px solid var(--ok); background: var(--ok-bg); }
.slot .lbl { font-weight: 700; }
.slot .lbl small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.pool .opt { text-align: left; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.pool .opt { width: auto; padding: 8px 14px; }
.pool .opt[hidden] { display: none; }

/* ---------- Footer ---------- */
footer { max-width: 52em; margin: 28px auto 0; color: var(--muted); font-size: 13px; text-align: center; }

/* ---------- Reduced motion: no movement, panels fade only ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .panel, .panel.open { transition: opacity .15s !important; }
  .backdrop { transition: opacity .15s !important; }
}
</style>
</head>

  panel: $("#panel"), body: $("#panel-body"), nav: $("#nav"),
  prev: $("#prev"), next: $("#next"), close: $("#close"),
  backdrop: $("#backdrop"), tip: $("#tip")
};

/* ====================================================================
   Board
   ==================================================================== */
function renderBoard() {
  el.board.textContent = "";
  STAGES.forEach((stage, i) => {
    const tile = h("button", {
      class: "tile", type: "button", "data-stage": i,
      "aria-label": stage.letter + ": " + stage.title
    }, stage.letter);
    const pill = h("div", { class: "pill" });
    stage.iconList.forEach((ic, j) => {
      const name = ICON_NAME.get(ic.id);
      const label = name + (ic.promised ? ", promised" : "") + ", in stage " + stage.n;
      const btn = h("button", {
        class: "ico", type: "button", style: "--j:" + j,
        "data-icon": ic.id, "data-stage": i, "data-promised": ic.promised ? "1" : "0",
        "aria-label": label, "data-tip": name + (ic.promised ? " \u00B7 promised" : "")
      }, iconSvg(ic.id, ic.promised));
      pill.append(btn);
    });
    el.board.append(h("div", { class: "col", style: "--i:" + i, "data-col": i }, tile, pill));
  });
}

/** Tiles drop in, columns unroll, icons pop. Clicking anything finishes it. */
function playIntro() {
  const token = ++state.introToken;
  el.board.classList.remove("intro");
  void el.board.offsetWidth;                // restart CSS animations
  if (reducedMotion()) return;
  el.board.classList.add("intro");
  const anims = el.board.getAnimations({ subtree: true });
  Promise.allSettled(anims.map(a => a.finished)).then(() => {
    if (token === state.introToken) el.board.classList.remove("intro");
  });
}

function finishIntro() {
  if (!el.board.classList.contains("intro")) return;
  el.board.getAnimations({ subtree: true }).forEach(a => { try { a.finish(); } catch (e) { /* already done */ } });
  el.board.classList.remove("intro");
}

function clearHighlight() {
  el.board.classList.remove("stage-mode", "icon-mode");
  $$(".col.sel", el.board).forEach(c => c.classList.remove("sel"));
  $$(".ico.hit, .ico.cur", el.board).forEach(b => b.classList.remove("hit", "cur"));
}

function highlightStage(i) {
  clearHighlight();
  el.board.classList.add("stage-mode");
  $(`.col[data-col="${i}"]`, el.board).classList.add("sel");
}

function highlightIcon(iconId, currentStage) {
  clearHighlight();
  el.board.classList.add("icon-mode");
  $$(`.ico[data-icon="${iconId}"]`, el.board).forEach(btn => {
    btn.classList.add("hit");
    if (Number(btn.dataset.stage) === currentStage) btn.classList.add("cur");
  });
}

/* ---------- Tooltip ---------- */
function showTip(target) {
  const text = target.getAttribute("data-tip");
  if (!text) return;
  el.tip.textContent = text;
  el.tip.classList.add("show");
  const r = target.getBoundingClientRect();
  const tw = el.tip.offsetWidth;
  let x = r.left + r.width / 2 - tw / 2;
  x = Math.max(6, Math.min(x, document.documentElement.clientWidth - tw - 6));
  let y = r.top - el.tip.offsetHeight - 8;
  if (y < 4) y = r.bottom + 8;
  el.tip.style.left = x + "px";
  el.tip.style.top = y + "px";
}
function hideTip() { el.tip.classList.remove("show"); }

/* ====================================================================
   Panel (stage view and icon view share one component)
   ==================================================================== */
function isNarrow() { return window.matchMedia("(max-width: 899px)").matches; }

function showPanel(trigger) {
  if (!state.panel || !el.panel.classList.contains("open")) {
    state.trigger = trigger || document.activeElement;
  }
  el.panel.classList.add("open");
  el.backdrop.classList.add("show");
}

function closePanel() {
  if (!el.panel.classList.contains("open")) return;
  el.panel.classList.remove("open");
  el.backdrop.classList.remove("show");
  state.panel = null;
  clearHighlight();
  setHash("");
  const back = state.trigger;
  state.trigger = null;
  if (back && document.contains(back) && back.offsetParent !== null) back.focus();
}

function focusTitle() {
  const title = $("#panel-title");
  if (title) title.focus({ preventScroll: true });
}

function openStage(i, trigger) {
  const stage = STAGES[i];
  state.panel = { type: "stage", i };
  showPanel(trigger);
  highlightStage(i);

  const facts = h("ul", { class: "facts" },
    h("li", null, h("b", null, "Era: "), stage.era),
    h("li", null, h("b", null, "Dates: "), stage.dates),
    h("li", null, h("b", null, "Testament: "), stage.testament),
    stage.covenant ? h("li", null, h("b", null, "Covenant in focus: "), stage.covenant) : null
  );
  const icons = h("div", { class: "mini-icons" }, stage.iconList.map(ic =>
    h("button", {
      class: "mini-ico", type: "button", "data-icon": ic.id,
      "aria-label": ICON_NAME.get(ic.id) + (ic.promised ? ", promised" : ""),
      "data-tip": ICON_NAME.get(ic.id) + (ic.promised ? " \u00B7 promised" : ""),
      onclick: e => openIcon(i, ic.id, e.currentTarget)
    }, iconSvg(ic.id, ic.promised))
  ));

  el.body.textContent = "";
  el.body.append(
    h("div", { class: "p-head" },
      h("div", { class: "bigletter", "aria-hidden": "true" }, stage.letter),
      h("div", null,
        h("p", { class: "eyebrow" }, "Stage " + stage.n + " of " + STAGES.length),
        h("h2", { id: "panel-title", tabindex: "-1" }, stage.title))),
    facts,
    ...stage.summary.map(p => h("p", null, p)),
    h("h3", null, "Key texts"),
    h("ul", { class: "chips" }, stage.keyTexts.map(t => h("li", { class: "chip" }, t))),
    h("h3", null, "Icons in this stage"),
    icons
  );
  el.nav.style.visibility = "visible";
  el.prev.disabled = i === 0;
  el.next.disabled = i === STAGES.length - 1;
  el.prev.setAttribute("aria-label", i > 0 ? "Previous stage: " + STAGES[i - 1].title : "Previous stage");
  el.next.setAttribute("aria-label", i < STAGES.length - 1 ? "Next stage: " + STAGES[i + 1].title : "Next stage");
  el.body.parentElement.scrollTop = 0;
  setHash(stage.letter.toLowerCase());
  syncFocusAfterRender();
}

function openIcon(i, iconId, trigger) {
  const stage = STAGES[i];
  const entry = iconEntry(i, iconId);
  if (!entry) return;
  state.panel = { type: "icon", i, icon: iconId };
  showPanel(trigger);
  highlightIcon(iconId, i);

  const where = occurrences(iconId);
  const chips = h("ul", { class: "chips" }, where.map(si => {
    const s = STAGES[si];
    return h("li", null, h("button", {
      class: "chip", type: "button",
      "aria-current": si === i ? "true" : null,
      "aria-label": ICON_NAME.get(iconId) + " in stage " + s.letter + ": " + s.title,
      onclick: e => openIcon(si, iconId, e.currentTarget)
    }, s.letter + " · Stage " + s.n));
  }));

  el.body.textContent = "";
  el.body.append(
    h("div", { class: "icon-hero" }, iconSvg(iconId, entry.promised)),
    h("p", { class: "eyebrow" }, "Stage " + stage.n + " of " + STAGES.length + " · " + stage.letter),
    h("h2", { id: "panel-title", tabindex: "-1" }, ICON_NAME.get(iconId)),
    // Only the promise icons (offspring, land, nations) get a promised/fulfilled badge.
    ...(PROMISE_ICONS.has(iconId) ? [h("span", { class: "badge " + (entry.promised ? "promised" : "fulfilled") },
      entry.promised ? "Promised" : "Fulfilled")] : []),
    h("p", { class: "note" }, DATA.notes[stage.letter + ":" + iconId] || ""),
    h("p", null, h("button", { class: "linkbtn", type: "button", onclick: e => openStage(i, e.currentTarget) },
      "Read about Stage " + stage.n + " (" + stage.title + ")")),
    h("h3", null, "Trace this thread"),
    chips
  );
  el.nav.style.visibility = "hidden";
  el.body.parentElement.scrollTop = 0;
  setHash(stage.letter.toLowerCase());
  syncFocusAfterRender();
}

/** Move focus into the panel on open, but keep it on a nav button the user is pressing. */
function syncFocusAfterRender() {
  const active = document.activeElement;
  const keepOnNav = (active === el.prev || active === el.next) && !active.disabled;
  if (!keepOnNav) focusTitle();
}

/* ====================================================================
   Modes: explore / legend / quiz
   ==================================================================== */
function setMode(mode) {
  state.mode = mode;
  $$(".pillbtn[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  el.board.hidden = mode === "quiz";
  el.legend.hidden = mode !== "legend";
  el.quiz.hidden = mode !== "quiz";
  if (mode === "quiz") {
    closePanel();
    clearHighlight();
    quizHome();
    setHash("quiz");
  } else if (location.hash.toLowerCase() === "#quiz") {
    setHash("");
  }
  if (mode === "legend") renderLegend();
}

/* ---------- Legend ---------- */
function renderLegend() {
  const items = DATA.legend.map(([id, name]) => h("li", null,
    h("button", {
      class: "legend-item", type: "button", "data-icon": id,
      onclick: e => legendPick(id, e.currentTarget)
    }, h("span", { class: "swatch" }, iconSvg(id, false)), h("span", null, name))));
  el.legend.textContent = "";
  el.legend.append(
    h("h2", { id: "legend-title" }, "Legend"),
    h("div", { class: "legend-key" },
      h("div", { class: "pair" },
        h("span", { class: "swatch" }, iconSvg("offspring", true)),
        h("span", { class: "swatch" }, iconSvg("offspring", false))),
      h("span", null, DATA.ui.legendKey)),
    h("ul", { class: "legend-grid" }, items)
  );
}

function legendPick(iconId, trigger) {
  const first = firstAppearance(iconId);
  highlightIcon(iconId, first);
  el.board.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "center" });
  openIcon(first, iconId, trigger);
}

/* ====================================================================
   Quiz
   ==================================================================== */
const BEST_KEY = "kingdom-best";

function loadBest() {
  try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; }
}
function saveBest(kind, value, lowerIsBetter) {
  try {
    const best = loadBest();
    const old = best[kind];
    if (old == null || (lowerIsBetter ? value < old : value > old)) {
      best[kind] = value;
      localStorage.setItem(BEST_KEY, JSON.stringify(best));
    }
  } catch (e) { /* storage blocked: scores just are not remembered */ }
}

/* ---------- Question building ---------- */
function pickOptions(correct, pool, count = 4) {
  const others = shuffle(Array.from(new Set(pool)).filter(x => x !== correct)).slice(0, count - 1);
  const options = shuffle([correct].concat(others));
  return { options, answerIndex: options.indexOf(correct) };
}

function makeQuestion(key, type, prompt, correct, pool, why, iconId) {
  const { options, answerIndex } = pickOptions(correct, pool);
  return { key, type, prompt, iconId, options, answerIndex, why };
}

const ALL_TITLES = STAGES.map(s => s.title);
const ALL_LETTERS = STAGES.map(s => s.letter);
const ALL_LABELS = STAGES.map(stageLabel);

const QUESTION_MAKERS = {
  a: () => STAGES.map(s => makeQuestion("a:" + s.letter, "a",
    "What does " + s.letter + " stand for?", s.title, ALL_TITLES, whyStage(s))),
  b: () => STAGES.map(s => makeQuestion("b:" + s.letter, "b",
    "Which letter is “" + s.title + "”?", s.letter, ALL_LETTERS, whyStage(s))),
  c: () => STAGES.map(s => makeQuestion("c:" + s.letter, "c",
    "Which stage covers " + s.era + "?", stageLabel(s), ALL_LABELS, whyStage(s))),
  // Stages whose dates contain a "?" are skipped: the question would be unclear.
  d: () => STAGES.filter(s => !s.dates.includes("?")).map(s => makeQuestion("d:" + s.letter, "d",
    "Which stage is dated " + s.dates + "?", stageLabel(s), ALL_LABELS, whyStage(s))),
  e: () => ICON_IDS.map(id => {
    const first = STAGES[firstAppearance(id)];
    return makeQuestion("e:" + id, "e", "What does this image stand for?", ICON_NAME.get(id),
      DATA.legend.map(p => p[1]), ICON_NAME.get(id) + ". First seen in Stage " + first.n + ": " + first.title + ".", id);
  }),
  f: () => ICON_IDS.map(id => {
    const first = STAGES[firstAppearance(id)];
    return makeQuestion("f:" + id, "f", "In which stage does “" + ICON_NAME.get(id) + "” first appear?",
      stageLabel(first), ALL_LABELS, ICON_NAME.get(id) + " first appears in Stage " + first.n + ": " + first.title + ".");
  }),
  g: () => STAGES.slice(0, -1).map((s, i) => makeQuestion("g:" + s.letter, "g",
    "Which stage comes right after “" + s.title + "”?", stageLabel(STAGES[i + 1]), ALL_LABELS,
    whyStage(STAGES[i + 1]))),
  h: () => STAGES.filter(s => s.covenant).map(s => makeQuestion("h:" + s.letter, "h",
    "Which stage centers on the " + s.covenant + " covenant?", stageLabel(s), ALL_LABELS, whyStage(s))),
  i: () => {
    const f = DATA.ui.fixedQuestion;
    const second = STAGES[1];
    return [makeQuestion("i:fixed", "i", f.prompt, f.correct, [f.correct].concat(f.wrong),
      f.why + " (Stage " + second.n + ": " + second.title + ")")];
  }
};

function buildQuestions(kind) {
  if (kind === "letters") return shuffle(STAGES.map(s => ({
    key: "t:" + s.letter, type: "text", letter: s.letter, prompt: "What does " + s.letter + " stand for?",
    title: s.title, accepted: [s.title].concat(s.aliases || []), why: whyStage(s)
  })));
  // Full quiz: take one question from each type in turn so the mix stays varied.
  const pools = shuffle(Object.keys(QUESTION_MAKERS)).map(t => shuffle(QUESTION_MAKERS[t]()));
  const picked = [];
  while (picked.length < 12 && pools.some(p => p.length)) {
    for (const pool of pools) {
      if (pool.length && picked.length < 12) picked.push(pool.pop());
    }
  }
  return shuffle(picked);
}

/* ---------- Screens ---------- */
let quiz = null;   // { kind, questions, index, score, missed, answered }

function quizCard(...kids) {
  el.quiz.textContent = "";
  const card = h("div", { class: "card" }, kids);
  el.quiz.append(card);
  return card;
}

function quizHome() {
  quiz = null;
  const best = loadBest();
  const choice = (kind, title, text, bestText) => h("button", {
    class: "choice", type: "button", "data-kind": kind, onclick: () => startQuiz(kind)
  }, h("b", null, title), h("span", null, text + (bestText ? " · " + bestText : "")));
  quizCard(
    h("h2", { id: "quiz-title", tabindex: "-1" }, "Test yourself"),
    h("p", { class: "lead" }, "Pick a quiz. In multiple choice, keys 1 to 4 pick an answer. Enter moves on."),
    h("div", { class: "choices" },
      choice("letters", "Letters", "7 questions: type what each letter stands for",
        best.letters != null ? "Best " + best.letters + " / 7" : ""),
      choice("full", "Full quiz", "12 questions: a mix of everything",
        best.full != null ? "Best " + best.full + " / 12" : ""),
      choice("order", "Put it in order", "Put seven events of the story in order",
        best.order != null ? "Fewest misses " + best.order : ""))
  );
}

function startQuiz(kind) {
  if (kind === "order") return startOrder();
  quiz = { kind, questions: buildQuestions(kind), index: 0, score: 0, hinted: 0, missed: [], answered: false };
  renderQuestion();
}

function renderQuestion() {
  const q = quiz.questions[quiz.index];
  const total = quiz.questions.length;
  quiz.answered = false;
  if (q.type === "text") return renderTextQuestion(q, total);
  const opts = q.options.map((text, i) => h("button", {
    class: "opt", type: "button", "data-index": i,
    onclick: () => answer(i)
  }, h("span", { class: "num", "aria-hidden": "true" }, String(i + 1)), h("span", null, text), h("span", { class: "mark", "aria-hidden": "true" })));
  const next = h("button", { class: "primary", type: "button", id: "next-q", hidden: true, onclick: nextQuestion },
    quiz.index + 1 === total ? "See results" : "Next");
  quizCard(
    h("div", { class: "qmeta" }, h("span", null, "Question " + (quiz.index + 1) + " of " + total)),
    h("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(quiz.index) },
      h("i", { style: "width:" + (quiz.index / total * 100) + "%" })),
    q.iconId ? h("div", { class: "qicon" }, iconSvg(q.iconId, false)) : null,
    h("h2", { id: "quiz-title", tabindex: "-1" }, q.prompt),
    h("div", { class: "opts", role: "group", "aria-label": "Answers" }, opts),
    h("p", { class: "feedback", id: "feedback", "aria-live": "polite" }),
    h("div", { class: "actions" }, next)
  );
  $("#quiz-title").focus({ preventScroll: true });
}

/* ---------- Type-in questions (Letters quiz) ---------- */
const SMALL_WORDS = ["and", "the", "of", "in"];

function normalizeAnswer(text) {
  return String(text).toLowerCase()
    .replace(/[\u2018\u2019\u201B]/g, "'").replace(/[\u201C\u201D]/g, '"')
    .replace(/&/g, " and ")
    .replace(/[^a-z ]/g, "")
    .split(/\s+/).filter(w => w && !SMALL_WORDS.includes(w)).join(" ");
}

function editDistance(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    for (let j = 1; j <= b.length; j++) {
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = row;
  }
  return prev[b.length];
}

// Returns "exact", "close" (a small typo) or "wrong".
function gradeTyped(typed, accepted) {
  const t = normalizeAnswer(typed);
  if (!t) return "wrong";
  let close = false;
  for (const a of accepted) {
    const n = normalizeAnswer(a);
    if (t === n) return "exact";
    if (editDistance(t, n) <= (n.length < 15 ? 1 : 2)) close = true;
  }
  return close ? "close" : "wrong";
}

function maskTitle(title) {
  return title.split(" ").map(w => SMALL_WORDS.includes(w.toLowerCase()) ? w : w[0] + w.slice(1).replace(/[A-Za-z]/g, "_")).join(" ");
}

function renderTextQuestion(q, total) {
  const input = h("input", {
    type: "text", id: "typed", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
    placeholder: "Type the stage title", onkeydown: e => {
      if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); checkTyped(); }
    }
  });
  const hintBtn = h("button", { class: "secondary", type: "button", id: "hint", onclick: showHint }, "Hint");
  const next = h("button", { class: "primary", type: "button", id: "next-q", hidden: true, onclick: nextQuestion },
    quiz.index + 1 === total ? "See results" : "Next");
  quizCard(
    h("div", { class: "qmeta" }, h("span", null, "Question " + (quiz.index + 1) + " of " + total)),
    h("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(quiz.index) },
      h("i", { style: "width:" + (quiz.index / total * 100) + "%" })),
    h("div", { class: "mini big", "aria-hidden": "true" }, q.letter),
    h("h2", { id: "quiz-title", tabindex: "-1" }, q.prompt),
    h("div", { class: "typein" },
      h("label", { for: "typed" }, "Your answer"),
      input,
      h("div", { class: "actions" },
        h("button", { class: "primary", type: "button", id: "check", onclick: checkTyped }, "Check"),
        hintBtn)),
    h("p", { class: "feedback", id: "feedback", "aria-live": "polite" }),
    h("div", { class: "actions" }, next)
  );
  $("#quiz-title").focus({ preventScroll: true });
}

function showHint() {
  if (!quiz || quiz.answered) return;
  const q = quiz.questions[quiz.index];
  if (!q.hinted) { q.hinted = true; quiz.hinted++; }
  const btn = $("#hint");
  if (btn) btn.replaceWith(h("span", { class: "hint-mask", id: "hint-mask" }, maskTitle(q.title)));
  $("#typed").focus();
}

function checkTyped() {
  if (!quiz || quiz.answered) return;
  const input = $("#typed");
  const typed = input.value.trim();
  if (!typed) return;
  const q = quiz.questions[quiz.index];
  const result = gradeTyped(typed, q.accepted);
  const ok = result !== "wrong";
  quiz.answered = true;
  input.disabled = true;
  input.classList.add(ok ? "right" : "wrong");
  $("#check").disabled = true;
  const hint = $("#hint");
  if (hint) hint.hidden = true;
  if (ok) quiz.score++;
  else quiz.missed.push({ prompt: q.prompt, typed, answer: q.title, why: q.why });
  const lead = result === "exact" ? "Correct. "
    : result === "close" ? "Correct. Watch the spelling: " + q.title + ". "
    : "Not quite. The answer is " + q.title + ". ";
  $("#feedback").append(h("strong", { class: ok ? "good" : "bad" }, lead), q.why);
  const next = $("#next-q");
  next.hidden = false;
  next.focus();
}

function answer(choice) {
  if (!quiz || quiz.answered) return;
  quiz.answered = true;
  const q = quiz.questions[quiz.index];
  const ok = choice === q.answerIndex;
  $$(".opt", el.quiz).forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answerIndex) {
      btn.classList.add("right");
      btn.dataset.correct = "true";
      $(".mark", btn).textContent = "✓";
    } else if (i === choice) {
      btn.classList.add("wrong");
      $(".mark", btn).textContent = "✗";
    }
  });
  if (ok) quiz.score++;
  else quiz.missed.push({ prompt: q.prompt, answer: q.options[q.answerIndex], why: q.why, iconId: q.iconId });
  const fb = $("#feedback");
  fb.append(h("strong", { class: ok ? "good" : "bad" }, ok ? "Correct. " : "Not quite. "), q.why);
  const next = $("#next-q");
  next.hidden = false;
  next.focus();
}

function nextQuestion() {
  if (!quiz || !quiz.answered) return;
  quiz.index++;
  if (quiz.index >= quiz.questions.length) renderEnd();
  else renderQuestion();
}

function miniRow() {
  return h("div", { class: "mini-row", "aria-hidden": "true" },
    STAGES.map((s, i) => h("span", { class: "mini", style: "--i:" + i }, s.letter)));
}

function renderEnd() {
  const total = quiz.questions.length;
  const score = quiz.score;
  const hinted = quiz.hinted || 0;
  const perfect = score === total && !hinted;
  const message = perfect ? "Perfect!" : score === total || score >= 9 || (total === 7 && score >= 6) ? "Well done." : "Keep going. Try again?";
  saveBest(quiz.kind, score, false);
  const kind = quiz.kind;
  const row = miniRow();
  quizCard(
    perfect ? row : null,
    h("p", { class: "eyebrow" }, "Your score"),
    h("div", { class: "score", id: "score" }, score + " / " + total),
    hinted ? h("p", { class: "lead", id: "hinted" }, hinted + " answered with a hint") : null,
    h("h2", { id: "quiz-title", tabindex: "-1" }, message),
    quiz.missed.length ? h("h3", null, "Missed") : null,
    quiz.missed.length ? h("ol", { class: "missed", id: "missed" }, quiz.missed.map(m =>
      h("li", null, m.prompt, m.typed ? h("small", null, "You typed: " + m.typed) : null,
        h("small", null, "Answer: " + m.answer), h("small", null, m.why)))) : null,
    h("div", { class: "actions" },
      h("button", { class: "primary", type: "button", id: "again", onclick: () => startQuiz(kind) }, "Try again"),
      h("button", { class: "secondary", type: "button", id: "back", onclick: backToFigure }, "Back to the figure"))
  );
  if (perfect) celebrate(row);
  $("#quiz-title").focus({ preventScroll: true });
}

function celebrate(row) {
  if (reducedMotion()) return;
  row.classList.add("wave");
  setTimeout(() => row.classList.remove("wave"), 1500);
}

function backToFigure() {
  setMode("explore");
  quiz = null;
}

/* ---------- Put it in order ---------- */
function startOrder() {
  quiz = { kind: "order", next: 0, misses: [], pool: shuffle(STAGES.map((s, i) => i)) };
  renderOrder();
}

function renderOrder() {
  const slots = STAGES.map((s, i) => h("li", {
    class: "slot" + (i < quiz.next ? " filled" : ""), "data-slot": i
  }, h("span", { class: "mini" }, i < quiz.next ? s.letter : String(i + 1)),
    h("span", { class: "lbl" }, i < quiz.next ? [s.title, h("small", null, s.era)] : "")));
  const pool = quiz.pool.map(si => h("button", {
    class: "opt", type: "button", "data-stage": si,
    hidden: si < quiz.next,
    onclick: e => tapOrder(si, e.currentTarget)
  }, STAGES[si].era));
  quizCard(
    h("h2", { id: "quiz-title", tabindex: "-1" }, "Put it in order"),
    h("p", { class: "lead" }, "Tap these events in the order they happen in the Bible's story."),
    h("ol", { class: "order" }, slots),
    h("div", { class: "pool", role: "group", "aria-label": "Events" }, pool)
  );
  $("#quiz-title").focus({ preventScroll: true });
}

function tapOrder(stageIndex, button) {
  if (stageIndex === quiz.next) {
    quiz.next++;
    if (quiz.next >= STAGES.length) return renderOrderEnd();
    renderOrder();
    const nextBtn = $(".pool .opt:not([hidden])", el.quiz);
    if (nextBtn) nextBtn.focus();
  } else {
    quiz.misses.push({ slot: quiz.next, tapped: stageIndex });
    button.classList.remove("shake");
    void button.offsetWidth;
    button.classList.add("shake");
  }
}

function renderOrderEnd() {
  const misses = quiz.misses;
  saveBest("order", misses.length, true);
  const row = miniRow();
  quizCard(
    misses.length === 0 ? row : null,
    h("p", { class: "eyebrow" }, "All seven in place"),
    h("div", { class: "score", id: "score" }, misses.length === 0 ? "No misses" : misses.length + (misses.length === 1 ? " miss" : " misses")),
    h("h2", { id: "quiz-title", tabindex: "-1" }, misses.length === 0 ? "Perfect!" : "Done. Try again for fewer misses?"),
    misses.length ? h("ol", { class: "missed", id: "missed" }, misses.map(m =>
      h("li", null, "For position " + (m.slot + 1) + " you tapped “" + STAGES[m.tapped].era + "”.",
        h("small", null, "Answer: " + STAGES[m.slot].era + " (" + STAGES[m.slot].letter + " · " + STAGES[m.slot].title + ")")))) : null,
    h("div", { class: "actions" },
      h("button", { class: "primary", type: "button", id: "again", onclick: startOrder }, "Try again"),
      h("button", { class: "secondary", type: "button", id: "back", onclick: backToFigure }, "Back to the figure"))
  );
  if (misses.length === 0) celebrate(row);
  $("#quiz-title").focus({ preventScroll: true });
}

/* ====================================================================
   URL hash, embedding, events
   ==================================================================== */
function setHash(value) {
  try {
    const url = location.pathname + location.search + (value ? "#" + value : "");
    history.replaceState(null, "", url);
  } catch (e) { /* some sandboxes block history changes */ }
}

function routeFromHash() {
  const key = location.hash.replace("#", "").toLowerCase();
  if (key === "quiz") { setMode("quiz"); return; }
  const i = stageIndexByLetter(key);
  if (key.length === 1 && i >= 0) openStage(i, $(`.tile[data-stage="${i}"]`));
}

function postHeight() {
  if (window.parent === window) return;
  try { parent.postMessage({ kingdomHeight: document.documentElement.scrollHeight }, "*"); } catch (e) { /* ignore */ }
}

function goToStage(i) {
  if (i < 0 || i >= STAGES.length) return;
  openStage(i);
}

function wireEvents() {
  document.addEventListener("click", finishIntro, true);

  el.board.addEventListener("click", e => {
    const ico = e.target.closest(".ico");
    const tile = e.target.closest(".tile");
    if (ico) openIcon(Number(ico.dataset.stage), ico.dataset.icon, ico);
    else if (tile) openStage(Number(tile.dataset.stage), tile);
  });

  // Tooltips on hover and keyboard focus, for board icons and panel icons
  const tipTarget = e => e.target.closest && e.target.closest("[data-tip]");
  document.addEventListener("mouseover", e => { const t = tipTarget(e); if (t) showTip(t); });
  document.addEventListener("mouseout", e => { if (tipTarget(e)) hideTip(); });
  document.addEventListener("focusin", e => { const t = tipTarget(e); if (t) showTip(t); else hideTip(); });
  document.addEventListener("focusout", hideTip);
  window.addEventListener("scroll", hideTip, { passive: true });

  $$(".pillbtn[data-mode]").forEach(btn => btn.addEventListener("click", () => setMode(btn.dataset.mode)));
  $("#replay").addEventListener("click", () => {
    if (state.mode === "quiz") setMode("explore");
    closePanel();
    clearHighlight();
    playIntro();
  });

  el.close.addEventListener("click", closePanel);
  el.backdrop.addEventListener("click", closePanel);
  el.prev.addEventListener("click", () => state.panel && goToStage(state.panel.i - 1));
  el.next.addEventListener("click", () => state.panel && goToStage(state.panel.i + 1));

  document.addEventListener("keydown", onKey);
  window.addEventListener("hashchange", routeFromHash);
}

function onKey(e) {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const panelOpen = el.panel.classList.contains("open");

  if (e.key === "Escape" && panelOpen) {
    e.preventDefault();
    closePanel();
    return;
  }
  if (panelOpen && state.panel && state.panel.type === "stage") {
    if (e.key === "ArrowRight") { e.preventDefault(); goToStage(state.panel.i + 1); return; }
    if (e.key === "ArrowLeft") { e.preventDefault(); goToStage(state.panel.i - 1); return; }
  }
  if (state.mode === "quiz" && quiz && quiz.questions) {
    const typing = e.target.closest && e.target.closest("input, textarea, select");
    const q = quiz.questions[quiz.index];
    if (!quiz.answered && /^[1-4]$/.test(e.key)) {
      if (typing || !q.options) return;
      const idx = Number(e.key) - 1;
      if (idx < q.options.length) answer(idx);
    } else if (quiz.answered && e.key === "Enter" && !(e.target.closest && e.target.closest("button, a"))) {
      e.preventDefault();
      nextQuestion();
    }
  }
}

function init() {
  $("#title").textContent = DATA.ui.title;
  $("#subtitle").textContent = DATA.ui.subtitle;
  renderBoard();
  wireEvents();
  playIntro();
  routeFromHash();
  if ("ResizeObserver" in window) new ResizeObserver(postHeight).observe(document.documentElement);
  window.addEventListener("load", postHeight);
  window.addEventListener("resize", postHeight);
  postHeight();
}

init();
</script>
</body>
</html>
